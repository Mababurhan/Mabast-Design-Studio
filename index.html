<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mabast Design Studio</title>
<style>
body{margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#05070d,#111827);padding:40px}
.wrap{max-width:1200px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.logo{font-size:70px;font-weight:bold;color:#d4af37}
h1{font-size:58px;margin:10px 0}
.gold{color:#d4af37}
.card{border:1px solid rgba(212,175,55,.3);padding:18px;border-radius:16px;background:rgba(255,255,255,.03);margin:12px 0}
.btn{display:inline-block;padding:14px 28px;background:#d4af37;color:#000;text-decoration:none;border-radius:30px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.work{border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:30px;text-align:center}
@media(max-width:800px){.wrap{grid-template-columns:1fr}h1{font-size:40px}}
</style>
</head>
<body>
<section class="hero">
<div class="wrap">
<div>
<div class="logo">MD</div>
<h1>MABAST <span class="gold">DESIGN</span></h1>
<p>We Design Brands That Stand Out.</p>
<div class="card">✓ Custom Logo Design</div>
<div class="card">✓ Brand Identity</div>
<div class="card">✓ Social Media Design</div>
<div class="card">✓ Poster & Banner Design</div>
<br>
<a class="btn" href="#">DM FOR ORDERS</a>
</div>

<div>
<h2 class="gold">Recent Work</h2>
<div class="grid">
<div class="work">AREN</div>
<div class="work">NATURA</div>
<div class="work">ALPHA</div>
<div class="work">FOCUS</div>
<div class="work">TECHNO</div>
<div class="work">JOURNEY</div>
</div>
</div>
</div>
</section>
</body>
</html>
